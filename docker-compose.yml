services:
  postgres:
    image: postgres:16-alpine
    container_name: oxbridge-crm-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: crm_demo
    ports:
      - "5432:5432"
    volumes:
      - crm_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d crm_demo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  crm_postgres_data:
