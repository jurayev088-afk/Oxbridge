databases:
  - name: oxbridge-db
    plan: free
    databaseName: crm_demo
    user: oxbridge

services:
  - type: web
    name: oxbridge
    runtime: node
    plan: free
    healthCheckPath: /api/health
    buildCommand: npm install --include=dev && npm install --prefix client --include=dev && npm install --prefix server --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: TZ
        value: Asia/Tashkent
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: oxbridge-db
          property: connectionString
      - key: TELEGRAM_POLLING
        value: "true"
      - key: TELEGRAM_BOT_USERNAME
        value: oxbridgeacademy_bot
      - key: TELEGRAM_BOT_TOKEN
        sync: false
